services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://familylists:${POSTGRES_PASSWORD}@db:5432/familylists
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID}
      APPLE_ADMIN_SUBS: ${APPLE_ADMIN_SUBS}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    mem_limit: 160m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: familylists
      POSTGRES_USER: familylists
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    volumes:
      - familylists-postgres:/var/lib/postgresql/data
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familylists -d familylists"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  familylists-postgres:
