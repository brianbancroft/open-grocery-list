name: FamilyLists
options:
  deploymentTarget: { iOS: "17.0" }
targets:
  FamilyLists:
    type: application
    platform: iOS
    sources: [FamilyLists]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.familylists
        INFOPLIST_FILE: FamilyLists/Info.plist
        CODE_SIGN_ENTITLEMENTS: FamilyLists/FamilyLists.entitlements
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
  FamilyListsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FamilyListsTests]
    dependencies: [{ target: FamilyLists }]
